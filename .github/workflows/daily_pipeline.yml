name: Daily Pipeline

# Runs at 06:30 UTC on weekdays (after most markets have closed in Asia/Europe).
# The snapshot committed here is what Streamlit Cloud reads on the next page load.
# Trigger manually from the Actions tab to backfill or debug.
on:
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Force fresh fetch from Yahoo (bypass cache)"
        type: boolean
        default: false
      lookback:
        description: "Override history window in days (leave blank for config default)"
        type: string
        default: ""

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          LOOKBACK_FLAG=""
          if [ -n "${{ github.event.inputs.lookback }}" ]; then
            LOOKBACK_FLAG="--lookback ${{ github.event.inputs.lookback }}"
          fi
          python -m carry_compass.pipeline.run $FORCE_FLAG $LOOKBACK_FLAG

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "data: pipeline snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
