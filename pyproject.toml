[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carry-regime-compass"
version = "0.2.0"
description = "Cross-asset carry-to-volatility monitor with macro regime inference."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "yfinance==1.3.0",
    "pandas==2.3.3",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "streamlit==1.57.0",
    "plotly==6.7.0",
    "streamlit-autorefresh==1.0.1",
    "loguru==0.7.3",
    "pydantic==2.13.3",
    "PyYAML==6.0.3",
    "tenacity==9.1.4",
    "SQLAlchemy==2.0.49",
    "pyarrow==24.0.0",
    "fredapi>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "freezegun==1.5.5",
    "ruff==0.15.12",
    "mypy==1.20.2",
]

[project.scripts]
carry-compass = "carry_compass.viz.app:main"

[tool.setuptools.packages.find]
include = ["carry_compass*"]

[tool.setuptools.package-data]
carry_compass = ["config/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
